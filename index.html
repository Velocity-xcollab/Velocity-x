<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Velocity X</title>

<style>

/* =========================
   VELOCITY X — CINEMATIC INTRO
   ========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050607;
    font-family:Arial,Helvetica,sans-serif;
}

/* =========================
   LANDSCAPE WARNING
   ========================= */

#portrait{
    position:fixed;
    inset:0;
    z-index:99999;

    display:none;
    align-items:center;
    justify-content:center;

    background:#050607;
    color:white;
    text-align:center;
}

.rotate-content{
    font-size:14px;
    letter-spacing:5px;
}

.rotate-small{
    margin-top:12px;
    font-size:10px;
    letter-spacing:3px;
    color:#9aa4aa;
}

@media (orientation:portrait){

    #portrait{
        display:flex;
    }

    #cinematic{
        display:none;
    }

}

/* =========================
   MAIN CINEMATIC SCREEN
   ========================= */

#cinematic{
    position:fixed;
    inset:0;
    overflow:hidden;

    background:#111;
}

/* =========================
   REAL CINEMATIC IMAGE
   ========================= */

.scene{
    position:absolute;
    inset:0;

    background-image:
        linear-gradient(
            90deg,
            rgba(0,0,0,.35),
            transparent 55%,
            rgba(0,0,0,.20)
        ),
        linear-gradient(
            180deg,
            rgba(255,255,255,.05),
            rgba(0,0,0,.30)
        ),
        url("assets/loading-scene.jpg");

    background-size:cover;
    background-position:center center;

    transform:scale(1.03);

    animation:
        cinematicZoom 12s
        ease-out forwards;
}

/* =========================
   CINEMATIC LIGHT
   ========================= */

.daylight{
    position:absolute;
    inset:0;

    background:
        radial-gradient(
            ellipse at 72% 18%,
            rgba(255,255,255,.22),
            transparent 30%
        );

    pointer-events:none;
}

/* =========================
   BRAND
   ========================= */

.brand{
    position:absolute;

    top:7%;
    left:6%;

    color:white;

    font-size:12px;
    font-weight:bold;

    letter-spacing:8px;

    text-shadow:
        0 2px 12px rgba(0,0,0,.7);

    z-index:20;
}

/* =========================
   GAME TITLE
   ========================= */

.game-title{
    position:absolute;

    top:12%;
    left:50%;

    transform:translateX(-50%);

    text-align:center;

    color:white;

    z-index:20;

    text-shadow:
        0 4px 25px rgba(0,0,0,.7);
}

.game-title h1{

    font-size:
        clamp(36px,6vw,82px);

    font-style:italic;

    font-weight:900;

    letter-spacing:
        clamp(5px,1vw,14px);

    white-space:nowrap;
}

.game-title h1 span{
    color:#d9ecff;
}

.game-title p{

    margin-top:8px;

    font-size:10px;

    letter-spacing:7px;

    opacity:.85;
}

/* =========================
   LOADING PANEL
   ========================= */

.loading{

    position:absolute;

    left:50%;
    bottom:7%;

    width:min(400px,48vw);

    transform:translateX(-50%);

    text-align:center;

    color:white;

    z-index:30;

    text-shadow:
        0 2px 10px rgba(0,0,0,.8);
}

.loading-label{

    margin-bottom:11px;

    font-size:10px;

    letter-spacing:5px;
}

.loading-track{

    width:100%;
    height:3px;

    background:
        rgba(255,255,255,.28);

    overflow:hidden;

    backdrop-filter:blur(5px);
}

.loading-progress{

    width:0%;
    height:100%;

    background:white;

    box-shadow:
        0 0 18px rgba(255,255,255,.9);

    animation:
        progress 9s
        cubic-bezier(.2,.7,.2,1)
        forwards;
}

.loading-status{

    margin-top:9px;

    font-size:9px;

    letter-spacing:3px;

    color:#e5edf1;
}

/* =========================
   CINEMATIC VIGNETTE
   ========================= */

.lens{

    position:absolute;
    inset:0;

    pointer-events:none;

    background:

        radial-gradient(
            ellipse at center,
            transparent 45%,
            rgba(0,0,0,.25) 75%,
            rgba(0,0,0,.55) 100%
        );

    z-index:15;
}

/* =========================
   FADE TO GAME
   ========================= */

.fade{

    position:absolute;
    inset:0;

    background:#030405;

    opacity:0;

    pointer-events:none;

    animation:
        fadeIn 1.5s ease 9s forwards;

    z-index:50;
}

/* =========================
   ANIMATIONS
   ========================= */

@keyframes progress{

    0%{
        width:0%;
    }

    20%{
        width:18%;
    }

    45%{
        width:43%;
    }

    70%{
        width:68%;
    }

    88%{
        width:87%;
    }

    100%{
        width:100%;
    }
}

@keyframes fadeIn{

    to{
        opacity:1;
    }
}

@keyframes cinematicZoom{

    from{
        transform:scale(1.03);
    }

    to{
        transform:scale(1.08);
    }
}

</style>

</head>

<body>

<!-- =========================
     PORTRAIT WARNING
     ========================= -->

<div id="portrait">

    <div class="rotate-content">

        LANDSCAPE MODE

        <div class="rotate-small">
            ROTATE YOUR DEVICE TO START VELOCITY X
        </div>

    </div>

</div>


<!-- =========================
     CINEMATIC INTRO
     ========================= -->

<div id="cinematic">

    <!-- SCENE -->

    <div class="scene"></div>

    <div class="daylight"></div>


    <!-- STREET -->

    <div class="street"></div>


    <!-- BACKGROUND PEOPLE -->

    <div class="background-person person1"></div>
    <div class="background-person person2"></div>
    <div class="background-person person3"></div>
    <div class="background-person person4"></div>


    <!-- LARGE CAR -->

    <div class="car">

        <div class="car-roof"></div>

        <div class="car-glass"></div>

        <div class="car-body"></div>

        <div class="car-light"></div>

        <div class="wheel wheel-front"></div>
        <div class="wheel wheel-back"></div>

    </div>


    <!-- WOMAN -->

    <div class="woman">

        <div class="woman-hair"></div>

        <div class="woman-head"></div>

        <div class="woman-body"></div>

    </div>


    <!-- BRAND -->

    <div class="brand">
        VX STUDIOS
    </div>


    <!-- GAME TITLE -->

    <div class="game-title">

        <h1>
            VELOCITY <span>X</span>
        </h1>

        <p>
            THE RACE BEGINS
        </p>

    </div>


    <!-- LOADING -->

    <div class="loading">

        <div class="loading-label">
            LOADING
        </div>

        <div class="loading-track">

            <div class="loading-progress"></div>

        </div>

        <div class="loading-status">
            PREPARING YOUR RIDE
        </div>

    </div>


    <div class="lens"></div>

    <div class="fade"></div>

</div>

</body>
</html>
