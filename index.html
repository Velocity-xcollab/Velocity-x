<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Velocity X</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#090b0d;
}

/* =========================
   LOADING SCREEN
   ========================= */

#loading{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;

    background:
        radial-gradient(
            ellipse at 70% 45%,
            #30363a 0%,
            #15191c 42%,
            #050607 100%
        );

    color:white;
}

/* subtle road/light effect */

#loading::before{
    content:"";
    position:absolute;
    width:160%;
    height:45%;
    bottom:-20%;
    left:-30%;

    transform:perspective(500px)
              rotateX(55deg);

    background:
        repeating-linear-gradient(
            90deg,
            transparent 0 90px,
            rgba(255,255,255,.025) 90px 92px
        );

    opacity:.8;
}

/* cinematic glow */

.glow{
    position:absolute;
    width:500px;
    height:500px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.12),
            transparent 65%
        );

    filter:blur(20px);
}

/* =========================
   BRAND
   ========================= */

.content{
    position:relative;
    z-index:5;

    text-align:center;

    animation:
        appear 1.8s ease-out forwards;
}

.studios{
    font-size:11px;
    font-weight:bold;
    letter-spacing:8px;

    opacity:.65;

    margin-bottom:22px;
}

.title{
    font-size:
        clamp(52px,12vw,110px);

    font-weight:900;
    font-style:italic;

    letter-spacing:8px;

    line-height:.9;

    text-shadow:
        0 8px 30px rgba(0,0,0,.8);
}

.subtitle{
    margin-top:18px;

    font-size:10px;
    letter-spacing:6px;

    opacity:.55;
}

/* =========================
   LOADING BAR
   ========================= */

.loading-box{
    position:absolute;

    bottom:9%;
    left:50%;

    transform:translateX(-50%);

    width:min(420px,70vw);

    z-index:10;
}

.loading-text{
    display:flex;
    justify-content:space-between;

    margin-bottom:9px;

    font-size:8px;
    letter-spacing:3px;

    opacity:.55;
}

.bar{
    width:100%;
    height:2px;

    background:rgba(255,255,255,.18);

    overflow:hidden;
}

.progress{
    height:100%;
    width:0%;

    background:white;

    animation:
        loadingProgress 8s
        linear forwards;
}

/* =========================
   ANIMATIONS
   ========================= */

@keyframes loadingProgress{

    from{
        width:0%;
    }

    to{
        width:100%;
    }
}

@keyframes appear{

    from{
        opacity:0;
        transform:scale(1.06);
    }

    to{
        opacity:1;
        transform:scale(1);
    }
}

/* =========================
   MOBILE
   ========================= */

@media(max-width:600px){

    .title{
        letter-spacing:5px;
    }

    .studios{
        letter-spacing:5px;
    }

    .subtitle{
        letter-spacing:4px;
    }
}
</style>
</head>

<body>

<!-- =========================
     VELOCITY X LOADING
     ========================= -->

<section id="loading">

    <div class="glow"></div>

    <div class="content">

        <div class="studios">
            VX STUDIOS
        </div>

        <div class="title">
            VELOCITY X
        </div>

        <div class="subtitle">
            DRIVE BEYOND LIMITS
        </div>

    </div>

    <div class="loading-box">

        <div class="loading-text">
            <span>LOADING</span>
            <span id="percent">0%</span>
        </div>

        <div class="bar">
            <div class="progress"></div>
        </div>

    </div>

</section>

<script>

let percent = 0;

const percentText =
    document.getElementById("percent");

const loading =
    document.getElementById("loading");

/* loading counter */

const counter =
    setInterval(() => {

        percent++;

        percentText.textContent =
            percent + "%";

        if(percent >= 100){

            clearInterval(counter);

        }

    },80);


/* after exactly 8 seconds */

setTimeout(() => {

    loading.style.transition =
        "opacity 1s ease";

    loading.style.opacity = "0";

    /*
      CODE 2 WILL APPEAR HERE
      AFTER WE BUILD IT.
    */

},8000);

</script>

</body>
</html>
