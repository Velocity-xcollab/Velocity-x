<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Velocity X</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
background:#020308;
font-family:Arial,Helvetica,sans-serif;
}

#splash{
position:fixed;
inset:0;
background:
radial-gradient(
circle at center,
#101827 0%,
#05070c 45%,
#010205 100%
);

display:flex;
align-items:center;
justify-content:center;

z-index:9999;

animation:splashFade 1s ease 4.5s forwards;
}

.studio{
text-align:center;
animation:studioReveal 2s ease forwards;
}

.vx{
font-size:82px;
font-weight:900;
font-style:italic;
letter-spacing:8px;

background:linear-gradient(
135deg,
#ffffff,
#00c8ff,
#ffffff
);

-webkit-background-clip:text;
background-clip:text;
color:transparent;

text-shadow:
0 0 30px rgba(0,200,255,.45);
}

.studio-name{
margin-top:8px;

font-size:16px;
font-weight:bold;

letter-spacing:8px;

color:#ffffff;

opacity:.85;
}

.line{
width:0;
height:2px;

margin:18px auto;

background:#00c8ff;

box-shadow:
0 0 15px #00c8ff;

animation:lineGrow 1.5s ease 1s forwards;
}

.presents{
font-size:10px;
letter-spacing:5px;
color:#7f8da3;
opacity:0;

animation:textAppear 1s ease 2.2s forwards;
}

.game-title{
margin-top:12px;

font-size:30px;
font-weight:900;
font-style:italic;

letter-spacing:4px;

color:white;

opacity:0;

animation:titleAppear 1.2s ease 2.7s forwards;
}

.game-title span{
color:#00c8ff;
}

@keyframes studioReveal{

0%{
opacity:0;
transform:scale(.7);
filter:blur(15px);
}

100%{
opacity:1;
transform:scale(1);
filter:blur(0);
}

}

@keyframes lineGrow{

from{
width:0;
}

to{
width:180px;
}

}

@keyframes textAppear{

from{
opacity:0;
transform:translateY(10px);
}

to{
opacity:1;
transform:translateY(0);
}

}

@keyframes titleAppear{

from{
opacity:0;
transform:translateY(15px);
}

to{
opacity:1;
transform:translateY(0);
}

}

@keyframes splashFade{

to{
opacity:0;
visibility:hidden;
}

}

</style>
</head>

<body>

<!-- VX STUDIOS SPLASH SCREEN -->

<div id="splash">

<div class="studio">

<div class="vx">
VX
</div>

<div class="studio-name">
STUDIOS
</div>

<div class="line"></div>

<div class="presents">
PRESENTS
</div>

<div class="game-title">
VELOCITY <span>X</span>
</div>

</div>

</div>

<!-- GAME WILL BE BUILT HERE -->

<div id="game"></div>

</body>
  </html>
