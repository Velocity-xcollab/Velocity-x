<style>
*{

html,body{

    background:#090b0d;
}

/* =========================
   LOADING SCREEN
   ========================= */

#loading{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;

    background:
        radial-gradient(
            ellipse at 70% 45%,
            #30363a 0%,
            #15191c 42%,
            #050607 100%
        );

    color:white;
}

/* subtle road/light effect */

#loading::before{
    content:"";
    position:absolute;
    width:160%;
    height:45%;
    bottom:-20%;
    left:-30%;

    transform:perspective(500px)
              rotateX(55deg);

    background:
        repeating-linear-gradient(
            90deg,
            transparent 0 90px,
            rgba(255,255,255,.025) 90px 92px
        );

    opacity:.8;
}

/* cinematic glow */

.glow{
    position:absolute;
    width:500px;
    height:500px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.12),
            transparent 65%
        );

    filter:blur(20px);
}

/* =========================
   BRAND
   ========================= */

.content{
    position:relative;
    z-index:5;

    text-align:center;

    animation:
        appear 1.8s ease-out forwards;
}

.studios{
    font-size:11px;
    font-weight:bold;
    letter-spacing:8px;

    opacity:.65;

    margin-bottom:22px;
}

.title{
    font-size:
        clamp(52px,12vw,110px);

    font-weight:900;
    font-style:italic;

    letter-spacing:8px;

    line-height:.9;

    text-shadow:
        0 8px 30px rgba(0,0,0,.8);
}

.subtitle{
    margin-top:18px;

    font-size:10px;
    letter-spacing:6px;

    opacity:.55;
}

/* =========================
   LOADING BAR
   ========================= */

.loading-box{
    position:absolute;

    bottom:9%;
    left:50%;

    transform:translateX(-50%);

    width:min(420px,70vw);

    z-index:10;
}

.loading-text{
    display:flex;
    justify-content:space-between;

    margin-bottom:9px;

    font-size:8px;
    letter-spacing:3px;

    opacity:.55;
}

.bar{
    width:100%;
    height:2px;

    background:rgba(255,255,255,.18);

    overflow:hidden;
}

.progress{
    height:100%;
    width:0%;

    background:white;

    animation:
        loadingProgress 8s
        linear forwards;
}

/* =========================
   ANIMATIONS
   ========================= */

@keyframes loadingProgress{

    from{
        width:0%;
    }

    to{
        width:100%;
    }
}

@keyframes appear{

    from{
        opacity:0;
        transform:scale(1.06);
    }

    to{
        opacity:1;
        transform:scale(1);
    }
}

/* =========================
   MOBILE
   ========================= */

@media(max-width:600px){

    .title{
        letter-spacing:5px;
    }

    .studios{
        letter-spacing:5px;
    }

    .subtitle{
        letter-spacing:4px;
    }
}

    document.querySelectorAll(".location-card");

    document.getElementById("location-next");

let selectedLocation = null;


/* =========================
   SELECT LOCATION
   ========================= */

locationCards.forEach(card => {

    card.addEventListener("click", () => {

        locationCards.forEach(item => {
            item.classList.remove("selected");
        });

        card.classList.add("selected");

        selectedLocation =
            card.dataset.location;

        locationNext.disabled = false;

    });

});

        handling:90,
        nitro:97,
        unlocked:false
    }

];


/* =========================
   ELEMENTS
   ========================= */

const carsScreen =
    document.getElementById("cars-screen");

const carName =
    document.getElementById("car-name");

const carType =
    document.getElementById("car-type");

const carSpeed =
    document.getElementById("car-speed");

const carAccel =
    document.getElementById("car-accel");

const carHandling =
    document.getElementById("car-handling");

const carNitro =
    document.getElementById("car-nitro");

const carStatus =
    document.getElementById("car-status");

const carNumber =
    document.getElementById("car-number");

const selectCar =
    document.getElementById("select-car");

const carDots =
    document.getElementById("car-dots");

const chosenLocation =
    document.getElementById("chosen-location");

const previousCar =
    document.getElementById("car-prev");

const nextCar =
    document.getElementById("car-next");


let currentCar = 0;


/* =========================
   CREATE DOTS
   ========================= */

vxCars.forEach((car,index)=>{

    const dot =
        document.createElement("div");

    dot.className = "car-dot";

    if(index === 0){
        dot.classList.add("active");
    }

    carDots.appendChild(dot);

});


/* =========================
   SHOW CAR
   ========================= */

function showCar(index){

    const car = vxCars[index];

    carName.textContent =
        car.name;

    carType.textContent =
        car.type;

    carSpeed.textContent =
        car.speed;

    carAccel.textContent =
        car.accel;

    carHandling.textContent =
        car.handling;

    carNitro.textContent =
        car.nitro;

    carNumber.textContent =
        String(index + 1).padStart(2,"0")
        + " / "
        + String(vxCars.length).padStart(2,"0");


    document
        .querySelectorAll(".car-dot")
        .forEach((dot,i)=>{

            dot.classList.toggle(
                "active",
                i === index
            );

        });


    if(car.unlocked){

        carStatus.textContent =
            "UNLOCKED";

        carStatus.classList.remove(
            "locked"
        );

        selectCar.textContent =
            "SELECT CAR";

        selectCar.classList.remove(
            "locked-button"
        );

        selectCar.disabled = false;

    }else{

        carStatus.textContent =
            "LOCKED";

        carStatus.classList.add(
            "locked"
        );

        selectCar.textContent =
            "LOCKED";

        selectCar.classList.add(
            "locked-button"
        );

        selectCar.disabled = true;

    }

}


/* =========================
   NEXT / PREVIOUS
   ========================= */

nextCar.addEventListener("click",()=>{

    currentCar++;

    if(currentCar >= vxCars.length){
        currentCar = 0;
    }

    showCar(currentCar);

});


previousCar.addEventListener("click",()=>{

    currentCar--;

    if(currentCar < 0){
        currentCar = vxCars.length - 1;
    }

    showCar(currentCar);

});


/* =========================
   SELECT CAR
   ========================= */

selectCar.addEventListener("click",()=>{

    const car = vxCars[currentCar];

    if(!car.unlocked) return;

    localStorage.setItem(
        "vxSelectedCar",
        car.name
    );

    alert(
        car.name + " selected!"
    );

});


/* =========================
   LOAD LOCATION
   ========================= */

const savedLocation =
    localStorage.getItem("vxLocation");

if(savedLocation){

    chosenLocation.textContent =
        savedLocation.toUpperCase();

}


/* =========================
   INITIAL CAR
   ========================= */

showCar(0);

</script>

    },600);

});

</script>
