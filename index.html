<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Velocity X</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
background:#020308;
font-family:Arial,Helvetica,sans-serif;
}

/* LANDSCAPE WARNING */

#rotate{
position:fixed;
inset:0;
z-index:10000;
background:#020308;
color:white;
display:none;
align-items:center;
justify-content:center;
text-align:center;
}

.rotate-box{
font-size:18px;
letter-spacing:2px;
}

.rotate-icon{
font-size:55px;
margin-bottom:15px;
}

/* INTRO */

#intro{
position:fixed;
inset:0;
z-index:9999;
overflow:hidden;
background:
linear-gradient(
180deg,
#02040b 0%,
#07101b 45%,
#020308 100%
);

animation:introOut 1.2s ease 7s forwards;
}

/* SKY GLOW */

.sky{
position:absolute;
inset:0;

background:
radial-gradient(
ellipse at 50% 45%,
rgba(0,190,255,.22),
transparent 42%
);

}

/* CITY */

.city{
position:absolute;
bottom:38%;
left:0;
width:100%;
height:25%;
display:flex;
align-items:end;
gap:4px;
padding:0 2%;
}

.building{
flex:1;
background:
linear-gradient(
180deg,
#101827,
#05070c
);

border-top:1px solid rgba(0,200,255,.15);
position:relative;
}

.building:nth-child(1){height:55%}
.building:nth-child(2){height:80%}
.building:nth-child(3){height:45%}
.building:nth-child(4){height:95%}
.building:nth-child(5){height:65%}
.building:nth-child(6){height:75%}
.building:nth-child(7){height:48%}
.building:nth-child(8){height:88%}
.building:nth-child(9){height:60%}
.building:nth-child(10){height:78%}
.building:nth-child(11){height:50%}
.building:nth-child(12){height:92%}

.building:after{
content:"";
position:absolute;
inset:10px;

background:
repeating-linear-gradient(
180deg,
rgba(0,200,255,.5) 0 2px,
transparent 2px 13px
);

opacity:.25;
}

/* ROAD */

.road{
position:absolute;
left:50%;
bottom:-25%;
width:130%;
height:70%;

transform:
translateX(-50%)
perspective(300px)
rotateX(55deg);

background:
linear-gradient(
90deg,
#020307,
#161b22 48%,
#020307
);

border-top:2px solid rgba(255,255,255,.15);
}

/* ROAD LINES */

.road:before{
content:"";
position:absolute;
left:50%;
top:-100%;
width:8px;
height:220%;

transform:translateX(-50%);

background:
repeating-linear-gradient(
180deg,
white 0 80px,
transparent 80px 150px
);

opacity:.65;

animation:roadMove .45s linear infinite;
}

/* ROAD GLOW */

.road:after{
content:"";
position:absolute;
inset:0;

background:
linear-gradient(
90deg,
transparent 42%,
rgba(0,200,255,.12),
transparent 58%
);
}

/* SPEED LIGHTS */

.speed{
position:absolute;
width:3px;
height:120px;

background:
linear-gradient(
transparent,
#00d9ff,
white
);

opacity:0;

animation:speed 1.2s linear infinite;
}

.s1{left:12%;top:35%;animation-delay:.1s}
.s2{left:25%;top:48%;animation-delay:.4s}
.s3{left:72%;top:40%;animation-delay:.2s}
.s4{left:88%;top:30%;animation-delay:.6s}
.s5{left:42%;top:28%;animation-delay:.8s}
.s6{left:63%;top:52%;animation-delay:.3s}

/* CAR */

.car{
position:absolute;
left:50%;
bottom:16%;

width:220px;
height:75px;

transform:
translateX(-50%)
scale(.65);

opacity:0;

animation:
carEnter 2.2s cubic-bezier(.15,.8,.2,1)
1s forwards;
}

.car-body{
position:absolute;
left:0;
bottom:10px;

width:100%;
height:55px;

background:
linear-gradient(
180deg,
#252c38,
#05070b
);

border-radius:
55px 55px 18px 18px;

box-shadow:
0 0 35px rgba(0,190,255,.35);
}

.car-roof{
position:absolute;
left:45px;
top:0;

width:125px;
height:45px;

background:
linear-gradient(
135deg,
#18202b,
#05070b
);

clip-path:
polygon(
15% 100%,
30% 10%,
72% 10%,
95% 100%
);
}

.window{
position:absolute;
left:63px;
top:9px;

width:90px;
height:25px;

background:
linear-gradient(
135deg,
#07141d,
#183746
);

clip-path:
polygon(
15% 100%,
25% 0,
65% 0,
88% 100%
);
}

.wheel{
position:absolute;
bottom:0;

width:43px;
height:43px;

border-radius:50%;

background:#020204;

border:7px solid #111820;

box-shadow:
0 0 0 2px #333;
}

.w1{left:25px}
.w2{right:25px}

/* NITRO */

.nitro{
position:absolute;
left:50%;
bottom:8%;

width:100px;
height:35px;

transform:translateX(-50%);

background:
radial-gradient(
ellipse,
rgba(0,220,255,.9),
transparent 65%
);

filter:blur(8px);

animation:nitro .25s infinite alternate;
}

/* TITLE */

.logo{
position:absolute;
left:50%;
top:50%;

transform:
translate(-50%,-50%)
scale(.5);

text-align:center;

opacity:0;

animation:logoReveal 1.8s ease 3.3s forwards;
}

.vx{
font-size:72px;
font-weight:900;
font-style:italic;
letter-spacing:12px;

color:white;

text-shadow:
0 0 15px #00c8ff,
0 0 45px rgba(0,200,255,.8);
}

.studios{
font-size:13px;
letter-spacing:9px;
margin-top:-5px;
}

.present{
margin-top:22px;

font-size:10px;
letter-spacing:6px;

color:#7d8b9e;
}

.title{
margin-top:12px;

font-size:34px;
font-weight:900;
font-style:italic;
letter-spacing:5px;

text-shadow:
0 0 20px rgba(0,200,255,.6);
}

.title span{
color:#00d5ff;
}

/* ANIMATIONS */

@keyframes roadMove{

from{
transform:
translateX(-50%)
translateY(0);
}

to{
transform:
translateX(-50%)
translateY(150px);
}

}

@keyframes speed{

0%{
transform:translateY(250px) scaleY(.3);
opacity:0;
}

30%{
opacity:.8;
}

100%{
transform:translateY(-300px) scaleY(1.5);
opacity:0;
}

}

@keyframes carEnter{

0%{
opacity:0;
transform:
translateX(-50%)
translateY(160px)
scale(.35);
}

100%{
opacity:1;
transform:
translateX(-50%)
translateY(0)
scale(.8);
}

}

@keyframes nitro{

from{
opacity:.5;
transform:translateX(-50%) scaleX(.8);
}

to{
opacity:1;
transform:translateX(-50%) scaleX(1.2);
}

}

@keyframes logoReveal{

0%{
opacity:0;
transform:
translate(-50%,-50%)
scale(.4);
filter:blur(15px);
}

100%{
opacity:1;
transform:
translate(-50%,-50%)
scale(1);
filter:blur(0);
}

}

@keyframes introOut{

to{
opacity:0;
visibility:hidden;
}

}

/* PORTRAIT */

@media (orientation:portrait){

#rotate{
display:flex;
}

#intro{
display:none;
}

}

/* GAME */

#game{
position:fixed;
inset:0;
}

</style>

</head>

<body>

<!-- ROTATE SCREEN -->

<div id="rotate">

<div class="rotate-box">

<div class="rotate-icon">📱↔️</div>

ROTATE YOUR PHONE

<br>

<span style="font-size:12px;color:#8290a3;">
VELOCITY X IS DESIGNED FOR LANDSCAPE
</span>

</div>

</div>


<!-- CINEMATIC INTRO -->

<div id="intro">

<div class="sky"></div>


<!-- CITY -->

<div class="city">

<div class="building"></div>
<div class="building"></div>
<div class="building"></div>
<div class="building"></div>
<div class="building"></div>
<div class="building"></div>
<div class="building"></div>
<div class="building"></div>
<div class="building"></div>
<div class="building"></div>
<div class="building"></div>
<div class="building"></div>

</div>


<!-- ROAD -->

<div class="road"></div>


<!-- SPEED EFFECTS -->

<div class="speed s1"></div>
<div class="speed s2"></div>
<div class="speed s3"></div>
<div class="speed s4"></div>
<div class="speed s5"></div>
<div class="speed s6"></div>


<!-- CAR -->

<div class="car">

<div class="car-roof"></div>

<div class="window"></div>

<div class="car-body"></div>

<div class="wheel w1"></div>
<div class="wheel w2"></div>

</div>

<div class="nitro"></div>


<!-- LOGO -->

<div class="logo">

<div class="vx">VX</div>

<div class="studios">
STUDIOS
</div>

<div class="present">
PRESENTS
</div>

<div class="title">
VELOCITY <span>X</span>
</div>

</div>

</div>


<!-- GAME -->

<div id="game"></div>

</body>
</html>
